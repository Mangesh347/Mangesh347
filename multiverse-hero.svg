<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0030"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#002028"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="0.33" stop-color="#ffe600"/>
      <stop offset="0.66" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.55" stop-color="#3b0010"/>
      <stop offset="1" stop-color="#c4002b"/>
    </linearGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#ff2a6d" opacity="0.32"/>
    </pattern>
    <pattern id="scan" width="860" height="4" patternUnits="userSpaceOnUse">
      <rect width="860" height="2" fill="#000"/>
    </pattern>
    <clipPath id="panel"><rect width="860" height="520" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="860" height="520" fill="url(#bg)"/>
    <rect width="860" height="520" fill="url(#dots)"/>
    <ellipse cx="150" cy="130" rx="190" ry="100" fill="#ff2a6d" opacity="0.18"/>
    <ellipse cx="730" cy="100" rx="170" ry="90" fill="#00f0ff" opacity="0.16"/>
    <ellipse cx="430" cy="430" rx="280" ry="80" fill="#ffe600" opacity="0.10"/>

    <rect x="0.5" y="0.5" width="859" height="519" rx="12" fill="none" stroke="#30363d"/>
    <rect width="860" height="28" fill="#111722"/>
    <line x1="0" y1="28" x2="860" y2="28" stroke="#30363d"/>
    <circle cx="16" cy="14" r="4.5" fill="#ff5f56"/>
    <circle cx="31" cy="14" r="4.5" fill="#ffbd2e"/>
    <circle cx="46" cy="14" r="4.5" fill="#27c93f"/>
    <text x="430" y="18" fill="#7d8590" font-size="11.5" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">mangesh@github: ~$ ./multiverse.sh --glitch</text>

    <!-- glitch bars -->
    <rect x="0" y="96" width="860" height="8" fill="#00f0ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.55;0;0;0.28;0" keyTimes="0;0.1;0.13;0.18;0.6;0.63;1" dur="1.55s" repeatCount="indefinite"/>
      <animate attributeName="y" values="96;84;118;96" dur="1.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="206" width="860" height="6" fill="#ff2a6d" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.38;0.42;0.48;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="300" width="860" height="5" fill="#ffe600" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0;0;0.35;0" keyTimes="0;0.07;0.11;0.68;0.73;1" dur="1.85s" repeatCount="indefinite"/>
    </rect>

    <!-- MAGENTA ghost -->
    <g transform="translate(423,170)" fill="#ff2a6d" stroke="#ff2a6d">
      <ellipse cx="0" cy="-6" rx="72" ry="84"/>
      <path d="M-9,46 C-28,28 -38,58 -18,70 M9,46 C28,28 38,58 18,70 M0,42 C-22,78 0,86 0,62 M0,42 C22,78 0,86 0,62" fill="none" stroke-width="4" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="423,170; 416,171; 428,169; 420,170; 423,170" dur="0.42s" repeatCount="indefinite"/>
    </g>
    <!-- CYAN ghost -->
    <g transform="translate(437,170)" fill="#00f0ff" stroke="#00f0ff">
      <ellipse cx="0" cy="-6" rx="72" ry="84"/>
      <path d="M-9,46 C-28,28 -38,58 -18,70 M9,46 C28,28 38,58 18,70 M0,42 C-22,78 0,86 0,62 M0,42 C22,78 0,86 0,62" fill="none" stroke-width="4" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="437,170; 444,169; 431,171; 440,170; 437,170" dur="0.42s" repeatCount="indefinite"/>
    </g>
    <!-- YELLOW ghost -->
    <g transform="translate(430,174)" fill="#ffe600" opacity="0.55">
      <ellipse cx="0" cy="-6" rx="72" ry="84"/>
      <animateTransform attributeName="transform" type="translate" values="430,174; 430,166; 431,173; 430,174" dur="0.68s" repeatCount="indefinite"/>
    </g>

    <!-- main hero -->
    <g transform="translate(430,170)">
      <ellipse cx="0" cy="-6" rx="72" ry="84" fill="url(#suit)" stroke="#111" stroke-width="3"/>
      <g fill="none" stroke="#ff4d6d" stroke-width="1.7">
        <path d="M-62,-20 Q0,-70 62,-20"/>
        <path d="M-66,8 Q0,-28 66,8"/>
        <path d="M-58,38 Q0,8 58,38"/>
        <path d="M0,-88 L0,76"/>
        <path d="M-40,-78 L-18,74"/>
        <path d="M40,-78 L18,74"/>
        <path d="M-68,-40 L-30,72"/>
        <path d="M68,-40 L30,72"/>
      </g>
      <path d="M-58,-18 C-52,-58 -8,-62 -4,-18 C-6,8 -28,22 -48,12 C-60,6 -60,-2 -58,-18Z" fill="#f4fbff" stroke="#111" stroke-width="3"/>
      <path d="M58,-18 C52,-58 8,-62 4,-18 C6,8 28,22 48,12 C60,6 60,-2 58,-18Z" fill="#f4fbff" stroke="#111" stroke-width="3"/>
      <ellipse cx="-28" cy="-22" rx="7" ry="4" fill="#fff" opacity="0.75"/>
      <ellipse cx="22" cy="-22" rx="7" ry="4" fill="#fff" opacity="0.75"/>
      <g transform="translate(0,58)">
        <ellipse cx="0" cy="0" rx="8" ry="11" fill="#0a0a0a"/>
        <path d="M0,-10 C-18,-28 -28,-8 -22,6 M0,-10 C18,-28 28,-8 22,6 M-4,-2 C-30,-10 -34,18 -16,16 M4,-2 C30,-10 34,18 16,16 M-3,6 C-26,22 -14,34 -2,20 M3,6 C26,22 14,34 2,20 M-2,8 C-18,36 0,38 0,22 M2,8 C18,36 0,38 0,22" fill="none" stroke="#0a0a0a" stroke-width="3.1" stroke-linecap="round"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="430,170; 433,170; 428,170; 430,170; 430,170; 435,170; 430,170" dur="1.15s" repeatCount="indefinite"/>
    </g>

    <!-- tags -->
    <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
      <g>
        <rect x="113" y="327" width="264" height="52" rx="6" fill="#00f0ff" opacity="0.7">
          <animate attributeName="x" values="113;108;118;113" dur="0.28s" repeatCount="indefinite"/>
        </rect>
        <rect x="123" y="327" width="264" height="52" rx="6" fill="#ff2a6d" opacity="0.7">
          <animate attributeName="x" values="123;128;118;123" dur="0.28s" repeatCount="indefinite"/>
        </rect>
        <rect x="118" y="327" width="264" height="52" rx="6" fill="#111" stroke="#ffe600" stroke-width="3"/>
        <text x="250" y="361" font-size="22" fill="#ffe600" letter-spacing="1.6">I'M SPIDER-MAN</text>
      </g>
      <g>
        <rect x="457" y="327" width="296" height="52" rx="6" fill="#ff2a6d" opacity="0.7">
          <animate attributeName="x" values="457;463;452;457" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="467" y="327" width="296" height="52" rx="6" fill="#00f0ff" opacity="0.7">
          <animate attributeName="x" values="467;461;472;467" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="462" y="327" width="296" height="52" rx="6" fill="#111" stroke="#00f0ff" stroke-width="3"/>
        <text x="610" y="361" font-size="20" fill="#00f0ff" letter-spacing="1.3">SOFTWARE DEVELOPER</text>
      </g>
    </g>

    <!-- MANGESH -->
    <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle" font-size="96" letter-spacing="8">
      <text x="422" y="472" fill="#ff2a6d">MANGESH
        <animate attributeName="x" values="422;414;430;418;422" dur="0.38s" repeatCount="indefinite"/>
      </text>
      <text x="438" y="472" fill="#00f0ff">MANGESH
        <animate attributeName="x" values="438;446;430;442;438" dur="0.38s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="468" fill="#ffe600" opacity="0.75">MANGESH
        <animate attributeName="y" values="468;473;465;468" dur="0.52s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="472" fill="url(#nameGrad)">MANGESH
        <animate attributeName="opacity" values="1;1;0.25;1;1;0.15;1" keyTimes="0;0.16;0.19;0.24;0.7;0.74;1" dur="1.45s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="0" y="28" width="860" height="492" fill="url(#scan)" opacity="0.1"/>
  </g>
</svg>
